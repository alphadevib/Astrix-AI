<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%" fx="50%" fy="32%">
      <stop offset="0%" stop-color="#0E1736" />
      <stop offset="55%" stop-color="#070B18" />
      <stop offset="100%" stop-color="#03050C" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cyanVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="shieldFillGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#1E1B4B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="leftLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="rightLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="coreFacet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="aiTagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Navy / Pitch Black Background -->
  <rect width="800" height="680" rx="24" fill="url(#bgGlow)" />

  <!-- Subtle Aerospace Background Telemetry HUD Rings -->
  <circle cx="400" cy="225" r="190" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 9" />
  <circle cx="400" cy="225" r="165" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.12" />

  <!-- ==================== EMBLEM GROUP ==================== -->
  <g id="emblem" transform="translate(144, -20)">
    
    <!-- Autonomous Safety & Recovery Shield -->
    <g id="shieldLayer">
      <path d="M 256 70 
               L 376 122 
               C 376 238 334 322 256 368 
               C 178 322 136 238 136 122 
               Z" 
            fill="none" 
            stroke="url(#shieldBorderGrad)" 
            stroke-width="2.5" 
            stroke-linejoin="round"
            filter="url(#neonGlowCyan)"
            opacity="0.85" />

      <path d="M 256 77 
               L 368 126 
               C 368 232 328 312 256 356 
               C 184 312 144 232 144 126 
               Z" 
            fill="url(#shieldFillGrad)" 
            stroke="#1E293B" 
            stroke-width="1.2" />

      <path d="M 256 80 L 256 354" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 6" opacity="0.25" />
      <path d="M 175 205 L 337 205" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />
    </g>

    <!-- Back Arc of Orbital Ring -->
    <path d="M 112 250 C 135 170 240 135 380 150" 
          fill="none" 
          stroke="url(#orbitGrad)" 
          stroke-width="4.2" 
          stroke-linecap="round"
          stroke-dasharray="130 12 28 8" 
          opacity="0.85" />

    <!-- Geometric 'A' Body -->
    <g id="geometricA">
      <!-- Zenith Arrow -->
      <polygon points="256,92 276,155 256,146 236,155" fill="url(#coreFacet)" filter="url(#intenseGlow)" />

      <!-- Left Structural Pylon -->
      <polygon points="256,90 256,165 198,320 152,320 242,105" fill="url(#leftLegGrad)" />
      <!-- Left Chamfer Wing -->
      <polygon points="242,105 152,320 132,320 180,195 232,100" fill="#0284C7" opacity="0.9" />

      <!-- Right Structural Pylon -->
      <polygon points="256,90 256,165 314,320 360,320 270,105" fill="url(#rightLegGrad)" />
      <!-- Right Chamfer Wing -->
      <polygon points="270,105 360,320 380,320 332,195 280,100" fill="#581C87" opacity="0.9" />

      <!-- A Crossbar with Gap -->
      <polygon points="190,234 232,234 235,248 182,248" fill="#38BDF8" />
      <polygon points="280,234 322,234 330,248 277,248" fill="#A855F7" />
      <line x1="232" y1="241" x2="280" y2="241" stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="2 4" />

      <!-- Apex Line -->
      <line x1="256" y1="90" x2="256" y2="165" stroke="#FFFFFF" stroke-width="2" opacity="0.95" />

      <!-- Delta Negative Cutout -->
      <polygon points="256,164 228,232 284,232" fill="#070B18" stroke="#00F0FF" stroke-width="1.2" opacity="0.9" />
    </g>

    <!-- Front Arc of Orbital Ring -->
    <g id="orbitFront">
      <path d="M 88 264 C 138 340 305 328 424 196" 
            fill="none" 
            stroke="url(#orbitGrad)" 
            stroke-width="6" 
            stroke-linecap="round"
            filter="url(#neonGlowCyan)" />
      <path d="M 94 262 C 142 334 300 324 418 198" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="1.8" 
            opacity="0.92" />
    </g>

    <!-- Satellite / Spacecraft Node -->
    <g id="satelliteNode" transform="translate(388, 182) rotate(-32)">
      <circle cx="0" cy="0" r="14" fill="#00F0FF" opacity="0.3" filter="url(#neonGlowCyan)" />
      <!-- Solar Panels -->
      <rect x="-23" y="-4" width="13" height="8" rx="1.5" fill="#38BDF8" stroke="#0284C7" stroke-width="1" />
      <line x1="-16" y1="-4" x2="-16" y2="4" stroke="#0C4A6E" stroke-width="1" />
      <rect x="10" y="-4" width="13" height="8" rx="1.5" fill="#818CF8" stroke="#4338CA" stroke-width="1" />
      <line x1="17" y1="-4" x2="17" y2="4" stroke="#1E1B4B" stroke-width="1" />
      <!-- Main Bus -->
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="#F8FAFC" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3.5" fill="#00F0FF" filter="url(#intenseGlow)" />
      <!-- Antenna -->
      <line x1="0" y1="-7" x2="0" y2="-12" stroke="#F8FAFC" stroke-width="1.5" />
      <circle cx="0" cy="-12" r="1.5" fill="#00F0FF" />
    </g>

    <!-- Apex Sparkle -->
    <g transform="translate(256, 88)">
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" filter="url(#intenseGlow)" />
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#FFFFFF" stroke-width="1.8" />
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#FFFFFF" stroke-width="1.8" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY SECTION ==================== -->
  
  <!-- "ASTRIX" Text -->
  <g transform="translate(400, 442)" text-anchor="middle">
    <!-- Outer Glow for Text -->
    <text x="-48" y="0" 
          font-family="system-ui, -apple-system, 'Rajdhani', 'Orbitron', 'Montserrat', 'Inter', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="9" 
          fill="#FFFFFF" 
          filter="url(#neonGlowCyan)"
          opacity="0.35">ASTRIX</text>

    <!-- Main ASTRIX letters -->
    <text x="-48" y="0" 
          font-family="system-ui, -apple-system, 'Rajdhani', 'Orbitron', 'Montserrat', 'Inter', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="9" 
          fill="#FFFFFF">ASTRIX</text>

    <!-- Hyphen -->
    <text x="108" y="-2" 
          font-family="system-ui, -apple-system, 'Rajdhani', 'Orbitron', 'Montserrat', 'Inter', sans-serif" 
          font-size="60" 
          font-weight="900" 
          fill="#38BDF8">-</text>

    <!-- "-AI" Gradient Badge -->
    <text x="175" y="0" 
          font-family="system-ui, -apple-system, 'Rajdhani', 'Orbitron', 'Montserrat', 'Inter', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="6" 
          fill="url(#cyanVioletGrad)"
          filter="url(#neonGlowCyan)">AI</text>
  </g>

  <!-- Tagline: "AUTONOMOUS SPACECRAFT INTELLIGENCE" -->
  <g transform="translate(400, 492)" text-anchor="middle">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#94A3B8">AUTONOMOUS SPACECRAFT INTELLIGENCE</text>
  </g>

  <!-- Divider Line with Telemetry Nodes -->
  <g transform="translate(400, 528)">
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#1E293B" stroke-width="1.2" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="url(#cyanVioletGrad)" stroke-width="1.8" filter="url(#neonGlowCyan)" />
    <circle cx="0" cy="0" r="3.5" fill="#00F0FF" filter="url(#intenseGlow)" />
  </g>

  <!-- ==================== 6 COGNITIVE STEPS TELEMETRY ==================== -->
  <!-- Detect → Reason → Plan → Verify → Recover → Learn -->
  <g transform="translate(400, 580)" text-anchor="middle">
    <!-- Step 1: Detect -->
    <g transform="translate(-250, 0)">
      <circle cx="0" cy="-14" r="3" fill="#00F0FF" filter="url(#neonGlowCyan)" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#38BDF8">DETECT</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#64748B">01</text>
    </g>

    <text x="-200" y="-12" font-family="monospace" font-size="14" fill="#334155">→</text>

    <!-- Step 2: Reason -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="-14" r="3" fill="#38BDF8" filter="url(#neonGlowCyan)" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#38BDF8">REASON</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#64748B">02</text>
    </g>

    <text x="-100" y="-12" font-family="monospace" font-size="14" fill="#334155">→</text>

    <!-- Step 3: Plan -->
    <g transform="translate(-50, 0)">
      <circle cx="0" cy="-14" r="3" fill="#60A5FA" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#818CF8">PLAN</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#64748B">03</text>
    </g>

    <text x="0" y="-12" font-family="monospace" font-size="14" fill="#334155">→</text>

    <!-- Step 4: Verify -->
    <g transform="translate(50, 0)">
      <circle cx="0" cy="-14" r="3" fill="#818CF8" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#818CF8">VERIFY</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#64748B">04</text>
    </g>

    <text x="100" y="-12" font-family="monospace" font-size="14" fill="#334155">→</text>

    <!-- Step 5: Recover -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="-14" r="3" fill="#A855F7" filter="url(#neonGlowCyan)" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C084FC">RECOVER</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#64748B">05</text>
    </g>

    <text x="200" y="-12" font-family="monospace" font-size="14" fill="#334155">→</text>

    <!-- Step 6: Learn -->
    <g transform="translate(250, 0)">
      <circle cx="0" cy="-14" r="3" fill="#C084FC" filter="url(#neonGlowCyan)" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#E879F9">LEARN</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#64748B">06</text>
    </g>
  </g>

  <!-- Bottom Technical Coordinate Accent -->
  <text x="760" y="660" font-family="monospace" font-size="9" fill="#334155" text-anchor="end">SYS.VER: 2.4 // ORBIT: LEO 500KM // FAULT_RECOVERY_ENG</text>
  <text x="40" y="660" font-family="monospace" font-size="9" fill="#334155" text-anchor="start">AUTONOMY_CLASS_V // DIGITAL_TWIN_PROOF</text>
</svg>
