<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlowH" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070B18" />
      <stop offset="100%" stop-color="#03050C" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cyanVioletGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="shieldBorderGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="shieldFillGradH" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#1E1B4B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="leftLegGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="rightLegGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <linearGradient id="orbitGradH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="coreFacetH" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowH" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="260" rx="16" fill="url(#bgGlowH)" />

  <!-- Subtle Aerospace HUD Reticle Lines on Left -->
  <circle cx="150" cy="130" r="115" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 7" opacity="0.6" />
  <circle cx="150" cy="130" r="95" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.15" />

  <!-- ==================== EMBLEM (LEFT) ==================== -->
  <g id="emblemH" transform="translate(150, 130) scale(0.68) translate(-256, -230)">
    
    <!-- Shield -->
    <path d="M 256 70 L 376 122 C 376 238 334 322 256 368 C 178 322 136 238 136 122 Z" 
          fill="none" stroke="url(#shieldBorderGradH)" stroke-width="2.8" filter="url(#glowH)" opacity="0.85" />
    <path d="M 256 77 L 368 126 C 368 232 328 312 256 356 C 184 312 144 232 144 126 Z" 
          fill="url(#shieldFillGradH)" stroke="#1E293B" stroke-width="1.2" />

    <!-- Back Arc Orbit -->
    <path d="M 112 250 C 135 170 240 135 380 150" 
          fill="none" stroke="url(#orbitGradH)" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="130 12 28 8" opacity="0.85" />

    <!-- Geometric 'A' Body -->
    <polygon points="256,92 276,155 256,146 236,155" fill="url(#coreFacetH)" filter="url(#glowH)" />
    <polygon points="256,90 256,165 198,320 152,320 242,105" fill="url(#leftLegGradH)" />
    <polygon points="242,105 152,320 132,320 180,195 232,100" fill="#0284C7" opacity="0.9" />
    <polygon points="256,90 256,165 314,320 360,320 270,105" fill="url(#rightLegGradH)" />
    <polygon points="270,105 360,320 380,320 332,195 280,100" fill="#581C87" opacity="0.9" />

    <!-- A Crossbar -->
    <polygon points="190,234 232,234 235,248 182,248" fill="#38BDF8" />
    <polygon points="280,234 322,234 330,248 277,248" fill="#A855F7" />
    <line x1="232" y1="241" x2="280" y2="241" stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="2 4" />
    <line x1="256" y1="90" x2="256" y2="165" stroke="#FFFFFF" stroke-width="2" opacity="0.95" />
    <polygon points="256,164 228,232 284,232" fill="#070B18" stroke="#00F0FF" stroke-width="1.2" opacity="0.9" />

    <!-- Front Arc Orbit -->
    <path d="M 88 264 C 138 340 305 328 424 196" 
          fill="none" stroke="url(#orbitGradH)" stroke-width="6" stroke-linecap="round" filter="url(#glowH)" />
    <path d="M 94 262 C 142 334 300 324 418 198" 
          fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.92" />

    <!-- Satellite Node -->
    <g transform="translate(388, 182) rotate(-32)">
      <circle cx="0" cy="0" r="14" fill="#00F0FF" opacity="0.3" filter="url(#glowH)" />
      <rect x="-23" y="-4" width="13" height="8" rx="1.5" fill="#38BDF8" stroke="#0284C7" stroke-width="1" />
      <line x1="-16" y1="-4" x2="-16" y2="4" stroke="#0C4A6E" stroke-width="1" />
      <rect x="10" y="-4" width="13" height="8" rx="1.5" fill="#818CF8" stroke="#4338CA" stroke-width="1" />
      <line x1="17" y1="-4" x2="17" y2="4" stroke="#1E1B4B" stroke-width="1" />
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="#F8FAFC" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3.5" fill="#00F0FF" />
      <line x1="0" y1="-7" x2="0" y2="-12" stroke="#F8FAFC" stroke-width="1.5" />
      <circle cx="0" cy="-12" r="1.5" fill="#00F0FF" />
    </g>

    <!-- Apex Sparkle -->
    <g transform="translate(256, 88)">
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
  </g>

  <!-- ==================== VERTICAL DIVIDER ==================== -->
  <line x1="285" y1="45" x2="285" y2="215" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="285" cy="130" r="2.5" fill="#00F0FF" filter="url(#glowH)" />

  <!-- ==================== WORDMARK & TAGLINE (RIGHT) ==================== -->
  <g transform="translate(325, 102)">
    <!-- Wordmark -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Rajdhani', 'Orbitron', 'Montserrat', 'Inter', sans-serif" 
          font-size="58" 
          font-weight="900" 
          letter-spacing="8" 
          fill="#FFFFFF">ASTRIX</text>

    <text x="320" y="-3" 
          font-family="system-ui, -apple-system, 'Rajdhani', 'Orbitron', 'Montserrat', 'Inter', sans-serif" 
          font-size="54" 
          font-weight="900" 
          fill="#38BDF8">-</text>

    <text x="360" y="0" 
          font-family="system-ui, -apple-system, 'Rajdhani', 'Orbitron', 'Montserrat', 'Inter', sans-serif" 
          font-size="58" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#cyanVioletGradH)"
          filter="url(#glowH)">AI</text>

    <!-- Tagline -->
    <text x="4" y="38" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="6" 
          fill="#94A3B8">AUTONOMOUS SPACECRAFT INTELLIGENCE</text>
  </g>

  <!-- Telemetry 6 Steps Loop Pipeline Bar -->
  <g transform="translate(330, 185)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="0" r="3" fill="#00F0FF" filter="url(#glowH)" />
      <text x="14" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">DETECT</text>
    </g>
    <text x="82" y="4" font-family="monospace" font-size="11" fill="#334155">→</text>

    <!-- Step 2 -->
    <g transform="translate(104, 0)">
      <circle cx="4" cy="0" r="3" fill="#38BDF8" filter="url(#glowH)" />
      <text x="14" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">REASON</text>
    </g>
    <text x="188" y="4" font-family="monospace" font-size="11" fill="#334155">→</text>

    <!-- Step 3 -->
    <g transform="translate(210, 0)">
      <circle cx="4" cy="0" r="3" fill="#60A5FA" />
      <text x="14" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#818CF8">PLAN</text>
    </g>
    <text x="274" y="4" font-family="monospace" font-size="11" fill="#334155">→</text>

    <!-- Step 4 -->
    <g transform="translate(296, 0)">
      <circle cx="4" cy="0" r="3" fill="#818CF8" />
      <text x="14" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#818CF8">VERIFY</text>
    </g>
    <text x="372" y="4" font-family="monospace" font-size="11" fill="#334155">→</text>

    <!-- Step 5 -->
    <g transform="translate(394, 0)">
      <circle cx="4" cy="0" r="3" fill="#A855F7" filter="url(#glowH)" />
      <text x="14" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C084FC">RECOVER</text>
    </g>
    <text x="484" y="4" font-family="monospace" font-size="11" fill="#334155">→</text>

    <!-- Step 6 -->
    <g transform="translate(506, 0)">
      <circle cx="4" cy="0" r="3" fill="#C084FC" filter="url(#glowH)" />
      <text x="14" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#E879F9">LEARN</text>
    </g>
  </g>

  <!-- System Sub-label -->
  <text x="1060" y="235" font-family="monospace" font-size="9" fill="#334155" text-anchor="end">ORBITAL AGENT ENGINE // AUTONOMY L5</text>
</svg>
